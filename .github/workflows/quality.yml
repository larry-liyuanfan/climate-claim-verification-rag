name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install "numpy==1.26.4" -e ".[test,serve,ltr,dev,langchain]"
      - name: Lint and source type checks
        run: |
          python -m ruff check src scripts tests
          python -m mypy src/climate_rag
      - name: Run full test suite
        run: python -m pytest -q
      - name: Scan tracked text for secrets and PII
        run: python scripts/scan_tracked_secrets.py --repository .
