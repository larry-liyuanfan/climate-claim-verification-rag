name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test, serving and LTR dependencies
        run: python -m pip install -e ".[test,serve,ltr]"
      - name: Run full test suite
        run: python -m pytest -q
